name: Homebrew installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Homebrew PATH
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi
      - name: Install tap from the reviewed checkout
        run: brew tap HuangChenning/tap "$GITHUB_WORKSPACE"
      - name: Check formula across platforms
        run: brew readall --os=all --arch=all HuangChenning/tap
      - name: Install released binary and verify behavior
        run: |
          brew install HuangChenning/tap/orbit
          brew test HuangChenning/tap/orbit
          "$(brew --prefix orbit)/bin/orbit" --version
